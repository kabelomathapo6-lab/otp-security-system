<!DOCTYPE html>
<html>
<head>
  <title>Verify OTP</title>
</head>
<body>
  <h1>Verify OTP</h1>
  <p>Enter the email and the OTP to check if it is valid.</p>

  <label>Email:</label>
  <input type="email" id="email" placeholder="someone@example.com" />
  <br /><br />
  <label>OTP:</label>
  <input type="text" id="otp" placeholder="6-digit code" />
  <br /><br />
  <button onclick="verifyOtp()">Verify OTP</button>

  <p id="message"></p>

  <p><a href="/send.html">Go to Send OTP screen</a></p>

  <script>
    // Check the OTP for the email.
    function verifyOtp() {
      const email = document.getElementById("email").value;
      const otp = document.getElementById("otp").value;

      fetch("/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, otp: otp })
      })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          document.getElementById("message").innerText = result.message;
        })
        .catch(function () {
          document.getElementById("message").innerText = "Something went wrong.";
        });
    }
  </script>
</body>
</html>
